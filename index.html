<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UW Extension Community Educator CRM</title>
  <script>
    (function () {
      const baseUrl = 'https://raw.githubusercontent.com/awilson64-maker/fdl-community-crm/c982205df659eb2f8a8c0f5327b5d311dfea12fc/index.html';
      const marker = "    const relStatuses = ['potential', 'active', 'historic'];\n";
      const typeOptionsBlock = "    const organizationTypeOptions = [\n          \"Aging & Disability Resource Center\",\n          \"Agriculture & Rural Development\",\n          \"Animal Welfare\",\n          \"Arts, Culture & Tourism\",\n          \"Basic Needs\",\n          \"Community Capacity Building\",\n          \"Disability & Independent Living\",\n          \"Economic & Community Development\",\n          \"Education & Community Access\",\n          \"Education & Literacy\",\n          \"Education / K-12\",\n          \"Family & Behavioral Support\",\n          \"Food Security\",\n          \"Funder/Foundation\",\n          \"Government / Human Services\",\n          \"Health, Behavioral Health & Recovery\",\n          \"Healthcare / Behavioral Health\",\n          \"Healthcare / Clinic\",\n          \"Healthcare / Hospital\",\n          \"Housing & Homelessness\",\n          \"Immigration & Multicultural Support\",\n          \"Legal / Advocacy\",\n          \"Library / Community Learning\",\n          \"Mental Health / Crisis\",\n          \"Municipal / Local Government\",\n          \"Nonprofit / Community Partner\",\n          \"Public Health\",\n          \"Public Safety\",\n          \"Recreation / Parks\",\n          \"Recovery / Substance Use\",\n          \"Regional Resource\",\n          \"School District\",\n          \"Senior Services\",\n          \"Transportation\",\n          \"UW Extension Program\",\n          \"Veterans Services\",\n          \"Workforce Development\",\n          \"Youth Development\"\n        ];\n";
      const selectBlankBlock = "    function selectOptionsWithBlank(options, selected = '') {\n      return `<option value=\"\"></option>` + selectOptions(options, selected);\n    }\n";
      const helperBlock = "\n\n\n    function selectOptionsWithCurrent(options, selected = '') {\n      const selectedClean = String(selected || '').trim();\n      const values = new Map();\n      (options || []).forEach(option => {\n        const clean = String(option || '').trim().replace(/\\s+/g, ' ');\n        if (clean) values.set(normalizeTagKey(clean), clean);\n      });\n      if (selectedClean) values.set(normalizeTagKey(selectedClean), selectedClean);\n      return [...values.values()]\n        .sort((a, b) => a.localeCompare(b))\n        .map(o => `<option value=\"${esc(o)}\" ${normalizeTagKey(o) === normalizeTagKey(selectedClean) ? 'selected' : ''}>${esc(o)}</option>`)\n        .join('');\n    }\n\n    function allOrganizationTypeOptions(selected = '') {\n      const typeMap = new Map();\n      organizationTypeOptions.forEach(type => {\n        const clean = String(type || '').trim().replace(/\\s+/g, ' ');\n        if (clean) typeMap.set(normalizeTagKey(clean), clean);\n      });\n      state.organizations.forEach(org => {\n        const clean = String(org.type || '').trim().replace(/\\s+/g, ' ');\n        if (clean) typeMap.set(normalizeTagKey(clean), clean);\n      });\n      const cleanSelected = String(selected || '').trim().replace(/\\s+/g, ' ');\n      if (cleanSelected) typeMap.set(normalizeTagKey(cleanSelected), cleanSelected);\n      return [...typeMap.values()].sort((a, b) => a.localeCompare(b));\n    }\n\n    function addOrgTypeOption() {\n      const select = document.getElementById('orgTypeSelect');\n      if (!select) return;\n      const entered = prompt('Add new organization type/category:');\n      const clean = String(entered || '').trim().replace(/\\s+/g, ' ');\n      if (!clean) return;\n      const existing = [...select.options].find(option => normalizeTagKey(option.value) === normalizeTagKey(clean));\n      if (existing) {\n        select.value = existing.value;\n        return;\n      }\n      const option = document.createElement('option');\n      option.value = clean;\n      option.textContent = clean;\n      select.appendChild(option);\n      select.value = clean;\n    }\n";
      const oldTypeField = "<div><label>Type</label><input name=\"type\" value=\"${esc(o.type || '')}\"></div>";
      const newTypeField = "<div><label>Type</label><select name=\"type\" id=\"orgTypeSelect\"><option value=\"\">Select type...</option>${selectOptionsWithCurrent(allOrganizationTypeOptions(o.type || ''), o.type || '')}</select><button class=\"secondary\" type=\"button\" style=\"margin-top:8px;\" onclick=\"addOrgTypeOption()\">Add New Category</button></div>";

      function applyCrmPatches(html) {
        if (!html.includes('const organizationTypeOptions')) {
          html = html.replace(marker, marker + typeOptionsBlock);
        }
        if (!html.includes('function allOrganizationTypeOptions')) {
          html = html.replace(selectBlankBlock, selectBlankBlock + helperBlock);
        }
        if (html.includes(oldTypeField)) {
          html = html.replace(oldTypeField, newTypeField);
        }
        return html;
      }

      fetch(baseUrl, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Could not load CRM source file.');
          return response.text();
        })
        .then(html => {
          document.open();
          document.write(applyCrmPatches(html));
          document.close();
        })
        .catch(error => {
          document.body.innerHTML = '<main style="font-family: Arial, sans-serif; padding: 32px; color: #282728;"><h1>CRM could not load</h1><p>The CRM source file could not be loaded from GitHub. Try refreshing in a minute.</p><p style="color:#646569;">' + String(error.message || error) + '</p></main>';
        });
    })();
  </script>
</head>
<body>
  <main style="font-family: Arial, sans-serif; padding: 32px; color: #282728;">
    <h1>Loading Community Partner CRM...</h1>
  </main>
</body>
</html>
