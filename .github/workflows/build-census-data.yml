name: Build FDL Census Data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-census-data.yml'
      - 'data/census-build-trigger.txt'

permissions:
  contents: write

jobs:
  build-census-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build static Census data file
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          ACS_YEARS = ['2024', '2023', '2022']
          STATE = '55'
          COUNTY = '039'
          OUT_PATH = 'data/fdl-census-tracts.json'
          CENSUS_API_KEY = os.environ.get('CENSUS_API_KEY', '').strip()

          ACS_VARS = [
              'NAME',
              'B17001_001E', 'B17001_002E',
              'B19013_001E',
              'B08201_001E', 'B08201_002E',
              'B01001_001E',
              'B01001_003E', 'B01001_004E', 'B01001_005E', 'B01001_006E',
              'B01001_027E', 'B01001_028E', 'B01001_029E', 'B01001_030E',
              'B01001_020E', 'B01001_021E', 'B01001_022E', 'B01001_023E', 'B01001_024E', 'B01001_025E',
              'B01001_044E', 'B01001_045E', 'B01001_046E', 'B01001_047E', 'B01001_048E', 'B01001_049E',
              'B23025_003E', 'B23025_005E',
              'B25070_001E', 'B25070_007E', 'B25070_008E', 'B25070_009E', 'B25070_010E',
              'B22010_001E', 'B22010_002E',
              'B28002_001E', 'B28002_013E',
              'C16002_001E', 'C16002_004E', 'C16002_007E', 'C16002_010E', 'C16002_013E'
          ]
          CHILD_KEYS = ['B01001_003E', 'B01001_004E', 'B01001_005E', 'B01001_006E', 'B01001_027E', 'B01001_028E', 'B01001_029E', 'B01001_030E']
          SENIOR_KEYS = ['B01001_020E', 'B01001_021E', 'B01001_022E', 'B01001_023E', 'B01001_024E', 'B01001_025E', 'B01001_044E', 'B01001_045E', 'B01001_046E', 'B01001_047E', 'B01001_048E', 'B01001_049E']
          RENT_BURDEN_KEYS = ['B25070_007E', 'B25070_008E', 'B25070_009E', 'B25070_010E']
          LIMITED_ENGLISH_KEYS = ['C16002_004E', 'C16002_007E', 'C16002_010E', 'C16002_013E']

          def read_text(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'fdl-community-crm-census-builder/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read().decode('utf-8')

          def read_json(url):
              text = read_text(url)
              try:
                  return json.loads(text)
              except Exception as exc:
                  raise RuntimeError(f'Expected JSON but got: {text[:500]}') from exc

          def num(value):
              try:
                  n = float(value)
                  if n <= -999999:
                      return None
                  return n
              except Exception:
                  return None

          def pct(part, whole):
              if part is None or whole in (None, 0):
                  return None
              return part / whole * 100

          def fetch_acs():
              if not CENSUS_API_KEY:
                  raise RuntimeError('Missing CENSUS_API_KEY repository secret. Add it under Settings > Secrets and variables > Actions > New repository secret.')
              last_error = None
              for year in ACS_YEARS:
                  url = (
                      f'https://api.census.gov/data/{year}/acs/acs5?'
                      f'get={",".join(ACS_VARS)}&for=tract:*&in=state:{STATE}%20county:{COUNTY}&key={urllib.parse.quote(CENSUS_API_KEY)}'
                  )
                  try:
                      print(f'Trying ACS {year} with API key from repository secret.')
                      rows = read_json(url)
                      headers = rows[0]
                      out = {}
                      for values in rows[1:]:
                          item = dict(zip(headers, values))
                          geoid = f"{item['state']}{item['county']}{item['tract']}"
                          poverty_base = num(item.get('B17001_001E'))
                          poverty_count = num(item.get('B17001_002E'))
                          households = num(item.get('B08201_001E'))
                          no_vehicle = num(item.get('B08201_002E'))
                          total_pop = num(item.get('B01001_001E'))
                          child_count = sum(num(item.get(key)) or 0 for key in CHILD_KEYS)
                          senior_count = sum(num(item.get(key)) or 0 for key in SENIOR_KEYS)
                          labor_force = num(item.get('B23025_003E'))
                          unemployed = num(item.get('B23025_005E'))
                          renter_households = num(item.get('B25070_001E'))
                          rent_burdened = sum(num(item.get(key)) or 0 for key in RENT_BURDEN_KEYS)
                          snap_households = num(item.get('B22010_002E'))
                          internet_households = num(item.get('B28002_001E'))
                          no_internet = num(item.get('B28002_013E'))
                          language_households = num(item.get('C16002_001E'))
                          limited_english = sum(num(item.get(key)) or 0 for key in LIMITED_ENGLISH_KEYS)
                          out[geoid] = {
                              'geoid': geoid,
                              'name': item.get('NAME', ''),
                              'poverty': pct(poverty_count, poverty_base),
                              'income': num(item.get('B19013_001E')),
                              'noVehicle': pct(no_vehicle, households),
                              'senior': pct(senior_count, total_pop),
                              'children': pct(child_count, total_pop),
                              'unemployment': pct(unemployed, labor_force),
                              'rentBurden': pct(rent_burdened, renter_households),
                              'snap': pct(snap_households, households),
                              'noInternet': pct(no_internet, internet_households),
                              'limitedEnglish': pct(limited_english, language_households)
                          }
                      return year, out
                  except Exception as exc:
                      print(f'ACS {year} failed: {exc}')
                      last_error = exc
              raise RuntimeError(f'Could not fetch ACS data: {last_error}')

          def esri_json_to_geojson(data):
              features = []
              for item in data.get('features', []):
                  attrs = item.get('attributes') or {}
                  geometry = item.get('geometry') or {}
                  rings = geometry.get('rings') or []
                  geoid = str(attrs.get('GEOID') or attrs.get('GEOID20') or attrs.get('GEOID10') or '')
                  if not geoid.startswith('55039') or not rings:
                      continue
                  features.append({
                      'type': 'Feature',
                      'properties': {
                          'GEOID': geoid,
                          'TRACT': str(attrs.get('TRACT') or attrs.get('TRACTCE') or attrs.get('TRACTCE20') or ''),
                          'NAME': str(attrs.get('NAME') or attrs.get('BASENAME') or attrs.get('TRACT') or geoid)
                      },
                      'geometry': {
                          'type': 'MultiPolygon',
                          'coordinates': [[ring] for ring in rings]
                      }
                  })
              return {'type': 'FeatureCollection', 'features': features}

          def normalize_geojson(data):
              features = []
              for feature in data.get('features', []):
                  props = feature.get('properties') or {}
                  geoid = str(props.get('GEOID') or props.get('GEOID20') or props.get('GEOID10') or '')
                  if not geoid.startswith('55039'):
                      continue
                  props['GEOID'] = geoid
                  props['NAME'] = str(props.get('NAME') or props.get('BASENAME') or props.get('TRACT') or geoid)
                  feature['properties'] = props
                  features.append(feature)
              return {'type': 'FeatureCollection', 'features': features}

          def fetch_tract_shapes():
              last_error = None
              where = urllib.parse.quote("STATE='55' AND COUNTY='039'")
              layer_candidates = [7, 0, 10, 4]
              service_urls = ['https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Tracts_Blocks/MapServer']
              for service in service_urls:
                  for layer in layer_candidates:
                      base = f'{service}/{layer}/query?where={where}&outFields=*&outSR=4326&returnGeometry=true'
                      for fmt in ['geojson', 'json']:
                          url = base + f'&f={fmt}'
                          try:
                              data = read_json(url)
                              shapes = normalize_geojson(data) if fmt == 'geojson' else esri_json_to_geojson(data)
                              if shapes['features']:
                                  print(f'Using TIGERweb service {service}, layer {layer}, format {fmt}, features {len(shapes["features"])}')
                                  return shapes
                          except Exception as exc:
                              last_error = exc
              raise RuntimeError(f'Could not fetch tract shapes: {last_error}')

          acs_year, acs_by_geoid = fetch_acs()
          shapes = fetch_tract_shapes()

          if len(shapes['features']) > 200:
              raise RuntimeError(f'Expected tract-level geography but got {len(shapes["features"])} features. This probably means TIGERweb returned blocks or block groups.')

          for feature in shapes['features']:
              geoid = str(feature.get('properties', {}).get('GEOID', ''))
              feature.setdefault('properties', {})['acs'] = acs_by_geoid.get(geoid, {})

          payload = {
              'source': 'U.S. Census Bureau ACS 5-year and TIGERweb',
              'acsYear': acs_year,
              'state': STATE,
              'county': COUNTY,
              'generatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'metrics': {
                  'poverty': 'B17001_002E / B17001_001E',
                  'income': 'B19013_001E',
                  'noVehicle': 'B08201_002E / B08201_001E',
                  'senior': 'B01001 age 65+ cells / B01001_001E',
                  'children': 'B01001 under age 18 cells / B01001_001E',
                  'unemployment': 'B23025_005E / B23025_003E',
                  'rentBurden': 'B25070 gross rent 30%+ of income cells / B25070_001E',
                  'snap': 'B22010_002E / B22010_001E',
                  'noInternet': 'B28002_013E / B28002_001E',
                  'limitedEnglish': 'C16002 limited-English household cells / C16002_001E'
              },
              'geojson': shapes
          }

          os.makedirs(os.path.dirname(OUT_PATH), exist_ok=True)
          with open(OUT_PATH, 'w', encoding='utf-8') as f:
              json.dump(payload, f, separators=(',', ':'))
          print(f'Wrote {OUT_PATH} with {len(shapes["features"])} tracts using ACS {acs_year}.')
          PY

      - name: Patch Service Gap Lens page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('census-gap-preview-v3.html')
          html = path.read_text(encoding='utf-8')
          if 'href="favicon.svg"' not in html:
              html = html.replace('  <title>Service Gap Lens</title>\n', '  <title>Service Gap Lens</title>\n  <link rel="icon" type="image/svg+xml" href="favicon.svg" />\n')
          old_options = '<select id="metricSelect" onchange="renderMap()"><option value="poverty">Poverty rate</option><option value="income">Median household income</option><option value="noVehicle">No-vehicle households</option><option value="senior">Age 65+</option></select>'
          new_options = '<select id="metricSelect" onchange="renderMap()"><option value="poverty">Poverty rate</option><option value="income">Median household income</option><option value="noVehicle">No-vehicle households</option><option value="senior">Age 65+</option><option value="children">Children under 18</option><option value="unemployment">Unemployment rate</option><option value="rentBurden">Rent-burdened renters</option><option value="snap">SNAP households</option><option value="noInternet">No internet access</option><option value="limitedEnglish">Limited-English households</option></select>'
          html = html.replace(old_options, new_options)
          old_metrics = "const metrics={poverty:{label:'Poverty rate',suffix:'%',inverse:false},noVehicle:{label:'No-vehicle households',suffix:'%',inverse:false},senior:{label:'Age 65+',suffix:'%',inverse:false},income:{label:'Median household income',prefix:'$',inverse:true}};"
          new_metrics = "const metrics={poverty:{label:'Poverty rate',suffix:'%',inverse:false},noVehicle:{label:'No-vehicle households',suffix:'%',inverse:false},senior:{label:'Age 65+',suffix:'%',inverse:false},income:{label:'Median household income',prefix:'$',inverse:true},children:{label:'Children under 18',suffix:'%',inverse:false},unemployment:{label:'Unemployment rate',suffix:'%',inverse:false},rentBurden:{label:'Rent-burdened renters',suffix:'%',inverse:false},snap:{label:'SNAP households',suffix:'%',inverse:false},noInternet:{label:'No internet access',suffix:'%',inverse:false},limitedEnglish:{label:'Limited-English households',suffix:'%',inverse:false}};"
          html = html.replace(old_metrics, new_metrics)
          path.write_text(html, encoding='utf-8')
          print('Patched Service Gap Lens indicators.')
          PY

      - name: Commit updated Census data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fdl-census-tracts.json census-gap-preview-v3.html
          if git diff --cached --quiet; then
            echo "No Census data or page changes to commit."
          else
            git commit -m "Update static Census tract data and Service Gap Lens indicators"
            git push
          fi
